name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate sample data
        run: python data/generate_sample_crm.py
      - name: Run pipeline demo
        run: python run_demo.py
      - name: Run tests
        run: python -m pytest tests/ -q

  connector-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install connector deps
        run: npm install
      - name: Type-check TypeScript connectors
        run: npx tsc --noEmit
