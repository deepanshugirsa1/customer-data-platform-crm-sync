sources:
  - name: salesforce
    type: crm
    connector: typescript
    objects: [leads, accounts, contacts]
    sync_mode: incremental
    cursor_field: SystemModstamp
    schedule: "*/5 * * * *"
  - name: hubspot
    type: crm
    connector: typescript
    objects: [contacts, companies, deals]
    sync_mode: incremental
    cursor_field: updatedAt
    schedule: "*/5 * * * *"
  - name: clearbit_enrichment
    type: enrichment
    connector: python
    objects: [company_enrichment]
    sync_mode: on_demand
sla:
  freshness_minutes: 5
  completeness_pct: 98
