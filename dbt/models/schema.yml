version: 2

models:
  - name: canonical_accounts
    description: Deduplicated customer accounts for AI worker retrieval
    columns:
      - name: account_id
        description: Deterministic surrogate key derived from email/company
        tests: [unique, not_null]
      - name: email
        description: Winning email after reconciliation
        tests: [unique]
      - name: domain
        description: Company domain parsed from the winning email
      - name: confidence
        description: Merge confidence 0-1 from reconciliation rules
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: updated_at
        description: Last time the canonical record changed
        tests: [not_null]

sources:
  - name: crm
    description: Raw CRM extracts landed by connectors
    freshness:
      warn_after: {count: 6, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: updated_at
    tables:
      - name: staging_leads
